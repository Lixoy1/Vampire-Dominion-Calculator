<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vampire Dominion — Наследие Вампиров</title>
  <meta name="description" content="Независимый проект энтузиастов и любителей игры «Наследие Вампиров»: калькулятор, расчёты и планирование развития аккаунта." />
  <meta name="theme-color" content="#090507" />
  <link rel="icon" href="./assets/crest.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./assets/css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <main id="screen-container" class="screen-viewport"></main>

    <nav class="bottom-nav-bar bloodmoon-bottom-nav" id="bottom-nav" aria-label="Главная навигация">
      <button class="nav-item active" data-target="home" type="button">
        <span class="nav-icon">🏰</span>
        <span class="nav-label">Главная</span>
      </button>
      <button class="nav-item" data-target="resources" type="button">
        <span class="nav-icon">🎒</span>
        <span class="nav-label">Ресурсы</span>
      </button>
      <button class="nav-item" data-target="calculations" type="button">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Расчёты</span>
      </button>
      <button class="nav-item" data-target="settings" type="button">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Настройки</span>
      </button>
    </nav>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <section id="modal-sheet" class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 id="modal-title">Заголовок</h3>
        <button id="modal-close" class="icon-btn" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </section>
  </div>

  <div id="numpad-overlay" class="numpad-overlay hidden">
    <section class="numpad-sheet" role="dialog" aria-modal="true" aria-labelledby="numpad-title">
      <div class="numpad-top">
        <div class="numpad-heading">
          <div class="numpad-label" id="numpad-title">Введите значение</div>
          <button type="button" class="numpad-mode" data-key="MODE" aria-label="Переключить способ ввода">123</button>
        </div>
        <div class="numpad-display" id="numpad-display">0</div>
        <input class="numpad-direct-input" id="numpad-direct-input" type="text" inputmode="text" autocomplete="off" placeholder="Например, 2.5M" hidden />
        <div class="numpad-resolved" id="numpad-resolved">0</div>
        <div class="numpad-hint">Можно вводить с буквой: 2.5M = 2 500 000</div>
      </div>
      <div class="numpad-grid">
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-mult="K">K</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-mult="M">M</button>
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-mult="B">B</button>
        <button type="button" data-key=".">.</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="BACK">⌫</button>
        <button type="button" data-mult="T">T</button>
      </div>
      <div class="numpad-actions">
        <button type="button" class="btn-secondary" data-key="CANCEL">Отмена</button>
        <button type="button" class="btn-primary" data-key="DONE">Готово</button>
      </div>
    </section>
  </div>

  <div id="calc-loader" class="calc-loader hidden" aria-live="polite" aria-busy="true">
    <div class="calc-loader-card">
      <div class="crimson-spinner"></div>
      <div class="calc-loader-title" id="calc-loader-text">Считаем господство…</div>
      <div class="calc-loader-sub">Unified Oracle API проверяет ресурсы и кривые</div>
    </div>
  </div>

  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
