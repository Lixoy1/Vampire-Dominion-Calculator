services:
  - type: web
    name: vampire-dominion-calculator
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
