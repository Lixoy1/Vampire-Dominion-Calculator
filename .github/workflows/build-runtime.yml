name: Build runtime

on:
  push:
    branches: [main]

jobs:
  build-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-built]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Prepare runtime bundle
        run: |
          rm -rf runtime
          mkdir -p runtime/.next
          cp -R .next/standalone/. runtime/
          cp -R .next/static runtime/.next/static
          if [ -d public ]; then cp -R public runtime/public; fi
          cat > runtime/README.md <<'EOF'
          Generated standalone runtime for Vampire-Dominion-Calculator.
          Start with: node server.js
          Listen on 0.0.0.0:8080.
          EOF

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: vampire-dominion-runtime
          path: runtime
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Commit runtime bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime
          git commit -m "[runtime-built] build deployable runtime" || exit 0
          git push
