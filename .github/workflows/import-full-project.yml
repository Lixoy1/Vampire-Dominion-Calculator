name: Import full uploaded project

on:
  push:
    paths:
      - "import/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and unpack uploaded archive
        run: |
          cat import/vd-project.part* > /tmp/vd-project.tar.gz.b64
          base64 -d /tmp/vd-project.tar.gz.b64 > /tmp/vd-project.tar.gz
          mkdir -p /tmp/vd-project
          tar -xzf /tmp/vd-project.tar.gz -C /tmp/vd-project

      - name: Replace repository contents with uploaded project
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name import -exec rm -rf {} +
          cp -a /tmp/vd-project/. .
          rm -rf import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full uploaded project"
          git push

      - name: Install dependencies
        run: npm install
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
