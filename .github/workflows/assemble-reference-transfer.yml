name: Assemble reference calculator transfer
on:
  push:
    branches: [main]
    paths:
      - 'transfer/v5-bundle.b64.*'
      - 'transfer/manifest.json'
      - '.github/workflows/assemble-reference-transfer.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, 'Stage reference bundle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and install source files
        run: |
          set -euo pipefail
          test -f transfer/manifest.json
          cat transfer/v5-bundle.b64.* > /tmp/v5-bundle.b64
          base64 --decode /tmp/v5-bundle.b64 > /tmp/v5-bundle.tar.gz
          tar -xzf /tmp/v5-bundle.tar.gz -C .
          rm -rf transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html package.json js/app.js js/engine.js assets/css/style.css assets/crest.svg tests/engine.test.js tests/app-smoke.test.js verify_icons.py
          git commit -m "Port reference calculator features and test suite"
          git push origin HEAD:main
